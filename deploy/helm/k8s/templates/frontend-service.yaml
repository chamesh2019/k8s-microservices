apiVersion: v1
kind: Service 
metadata:
  name: {{ .Release.Name }}-frontend-service
  labels:
    release: {{ .Release.Name }}
    service: frontend-service
spec:
  type: {{ .Values.frontend.service.type }}
  selector:
    release: {{ .Release.Name }}
    service: frontend-service
  ports:
    - name: http
      port: {{ .Values.frontend.service.port }}
      targetPort: {{ .Values.frontend.service.port }}