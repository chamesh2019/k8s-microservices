apiVersion: v1
kind: Service 
metadata:
  name: {{ .Release.Name }}-rabbitmq-service
  labels:
    release: {{ .Release.Name }}
    service: rabbitmq-service
spec:
  type: {{ .Values.rabbitmq.service.type }}
  selector:
    release: {{ .Release.Name }}
    service: rabbitmq
  ports:
    {{- range .Values.rabbitmq.service.ports }}
    - name: {{ .name }}
      port: {{ .port }}
      targetPort: {{ .port }}
    {{ end -}}