apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-traffic-generator
  labels:
    release: {{ .Release.Name }}
    service: traffic-generator
spec:
  type: {{ .Values.trafficGenerator.service.type }}
  selector:
    release: {{ .Release.Name }}
    service: traffic-generator
  ports:
    - name: http
      port: {{ .Values.trafficGenerator.service.port }}
      targetPort: {{ .Values.trafficGenerator.service.port }}