trafficGenerator:
  enabled: true
  replicaCount: 1
  image:
    repository: ghcr.io/chamesh2019/traffic-generator
    tag: 1875fe9cef08c9da30fa05a6c663a3585e8d28b4
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8082
  requestsPerSecond: "1"
  frontendUrl: "http://{{ .Release.Name }}-frontend:80"
  orderServiceUrl: "http://{{ .Release.Name }}-order-service:{{ .Values.orderService.service.port }}"
  ratios:
    pageLoad: "0.3"
    checkout: "0.1"
    poll: "0.6"
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 250m
      memory: 128Mi
