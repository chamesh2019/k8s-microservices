rabbitmq:
  image:
    registry: docker.io
    repository: rabbitmq
    tag: 4.3.6
  enabled: true

  auth:
    username: 
    password: 
    erlangCookie: rbq

  persistence:
    enabled: false

  service:
    type: ClusterIP
    ports:
      - name: queue
        port: 5672
      - name: management
        port: 15672
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 250m
      memory: 128Mi
