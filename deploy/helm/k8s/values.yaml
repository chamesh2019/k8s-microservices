ingress:
  enabled: true
  className: traefik
  paths:
    - path: /api
      pathType: Prefix
      service:
        name: cloudmart-order-service
        port:
          number: 8080

    - path: /
      pathType: Prefix
      service:
        name: cloudmart-frontend-service
        port:
          number: 80

frontend:
  replicaCount: 1
  image:
    repository: cloudmart/frontend
    tag: v1.0
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 250m
      memory: 128Mi

orderService:
  replicaCount: 1
  image:
    repository: cloudmart/order-service
    tag: v1.1
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8080
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 250m
      memory: 128Mi

paymentService:
  replicaCount: 1
  image:
    repository: cloudmart/payment-service
    tag: v1.1
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8080
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 250m
      memory: 128Mi

rabbitmq:
  image:
    registry: docker.io
    repository: rabbitmq
    tag: 4.3.6
  enabled: true

  auth:
    username: chames
    password: chames
    erlangCookie: rbq

  persistence:
    enabled: false

  service:
    type: ClusterIP
    ports:
      - name: queue
        port: 5672
      - name: management
        port: 15672
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 250m
      memory: 128Mi

redis:
  image:
    registry: docker.io
    repository: redis
    tag: 7.0.11
  enabled: true

  persistence:
    enabled: false

  service:
    type: ClusterIP
    ports:
      - name: redis
        port: 6379
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 250m
      memory: 128Mi
