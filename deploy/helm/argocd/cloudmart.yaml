apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudmart
  namespace: argocd

spec:
  project: default
  source:
    repoURL: https://github.com/chamesh2019/k8s-microservices.git
    targetRevision: main
    path: deploy/helm/k8s
    helm:
      valueFiles:
        - values/rabbitmq.yaml
        - values/redis.yaml
        - values/payment-service.yaml
        - values/ingress.yaml
        - values/frontend.yaml
        - values/order-service.yaml
        - values/traffic-generator.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: cloudmart
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
